paths:
 /health:
  get:
   summary: Verificar estado de la API
   description: Endpoint simple para verificar que ShipNow está funcionando.
   tags:
    - Health
   responses:
    "200":
     description: API funcionando correctamente
     content:
      application/json:
       schema:
        type: object
        properties:
         status:
          type: string
          example: success
         message:
          type: string
          example: API funcionando